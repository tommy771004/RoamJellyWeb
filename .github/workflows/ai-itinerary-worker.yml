name: AI Itinerary Worker

on:
  repository_dispatch:
    types: [ai-itinerary]

permissions:
  contents: read

concurrency:
  group: ai-itinerary-${{ github.event.client_payload.jobId }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      JOB_ID: ${{ github.event.client_payload.jobId }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ALLOW_PAID_FALLBACK: ${{ secrets.ALLOW_PAID_FALLBACK }}
      AI_CHATGPT_RESPONSE_TIMEOUT_MS: ${{ secrets.AI_CHATGPT_RESPONSE_TIMEOUT_MS }}
      CHATGPT_STORAGE_STATE_PATH: ${{ github.workspace }}/.worker-secrets/chatgpt-storage-state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore ChatGPT browser session
        shell: bash
        env:
          CHATGPT_STORAGE_STATE_B64: ${{ secrets.CHATGPT_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$CHATGPT_STORAGE_STATE_B64" ]; then
            echo "ChatGPT session is not configured; the worker will apply the fallback policy."
            exit 0
          fi
          mkdir -p .worker-secrets
          chmod 700 .worker-secrets
          printf '%s' "$CHATGPT_STORAGE_STATE_B64" | base64 --decode > "$CHATGPT_STORAGE_STATE_PATH"
          chmod 600 "$CHATGPT_STORAGE_STATE_PATH"

      - name: Run AI itinerary worker
        run: npx tsx scripts/ai-itinerary-worker.ts

      - name: Remove temporary browser session
        if: always()
        run: rm -rf "${{ github.workspace }}/.worker-secrets"

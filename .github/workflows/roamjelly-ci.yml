name: RoamJelly CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  web-backend:
    name: Web and Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

  ios:
    name: iOS Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned simulator app
        run: |
          xcodebuild \
            -project ios/RoamJelly/RoamJelly.xcodeproj \
            -target RoamJelly \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

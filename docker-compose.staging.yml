version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: roamjelly-staging-postgres
    environment:
      POSTGRES_DB: roamjelly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d roamjelly']
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: roamjelly-staging-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 8

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roamjelly-staging-app
    env_file:
      - .env.staging
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_staging_data:
